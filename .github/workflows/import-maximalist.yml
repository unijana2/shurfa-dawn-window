name: Test Canva asset import
on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-maximalist.yml']
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test Canva URLs and commit diagnostics
        shell: bash
        env:
          EXACT: 'https://media.canva.com/v2/image-resize/format:PNG/height:112/quality:100/uri:ifs%3A%2F%2FM%2Fc7d76656-2fcd-4a2e-870f-b720d3390178/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAHikm5Q4tlfWNGgX_e1Si1z6i1SK60xPvFLu3DGlpZGY&exp=1791055615&osig=AAAAAAAAAAAAAAAAAAAAABUKtLX5KAJ8qQSD5tXhiSu4tM1fB4QSteX2HFN2az81&signer=media-rpc&token=AAIAAU0AJGM3ZDc2NjU2LTJmY2QtNGEyZS04NzBmLWI3MjBkMzM5MDE3OAAAAAABoQM71BhfFxjArmBn3IoeVaIx--pwQqDPxKctcCatcWrpY-7nvA&x-canva-quality=thumbnail'
          HI: 'https://media.canva.com/v2/image-resize/format:PNG/height:1080/quality:100/uri:ifs%3A%2F%2FM%2Fc7d76656-2fcd-4a2e-870f-b720d3390178/watermark:F/width:1920?csig=AAAAAAAAAAAAAAAAAAAAAHikm5Q4tlfWNGgX_e1Si1z6i1SK60xPvFLu3DGlpZGY&exp=1791055615&osig=AAAAAAAAAAAAAAAAAAAAABUKtLX5KAJ8qQSD5tXhiSu4tM1fB4QSteX2HFN2az81&signer=media-rpc&token=AAIAAU0AJGM3ZDc2NjU2LTJmY2QtNGEyZS04NzBmLWI3MjBkMzM5MDE3OAAAAAABoQM71BhfFxjArmBn3IoeVaIx--pwQqDPxKctcCatcWrpY-7nvA&x-canva-quality=print'
          NODIMS: 'https://media.canva.com/v2/image-resize/format:PNG/quality:100/uri:ifs%3A%2F%2FM%2Fc7d76656-2fcd-4a2e-870f-b720d3390178/watermark:F?csig=AAAAAAAAAAAAAAAAAAAAAHikm5Q4tlfWNGgX_e1Si1z6i1SK60xPvFLu3DGlpZGY&exp=1791055615&osig=AAAAAAAAAAAAAAAAAAAAABUKtLX5KAJ8qQSD5tXhiSu4tM1fB4QSteX2HFN2az81&signer=media-rpc&token=AAIAAU0AJGM3ZDc2NjU2LTJmY2QtNGEyZS04NzBmLWI3MjBkMzM5MDE3OAAAAAABoQM71BhfFxjArmBn3IoeVaIx--pwQqDPxKctcCatcWrpY-7nvA'
        run: |
          set +e
          mkdir -p portfolio-v2/assets/maximalist
          : > portfolio-v2/assets/maximalist/diagnostic.txt
          for key in EXACT HI NODIMS; do
            url="$(printenv "$key")"
            code=$(curl -L -sS -o "/tmp/$key.bin" -w "%{http_code}" "$url")
            bytes=$(wc -c < "/tmp/$key.bin" 2>/dev/null || echo 0)
            mime=$(file -b --mime-type "/tmp/$key.bin" 2>/dev/null || true)
            dims=$(identify -format "%wx%h" "/tmp/$key.bin" 2>/dev/null || true)
            echo "$key status=$code bytes=$bytes mime=$mime dims=$dims" >> portfolio-v2/assets/maximalist/diagnostic.txt
          done
          if identify /tmp/HI.bin >/dev/null 2>&1; then cp /tmp/HI.bin portfolio-v2/assets/maximalist/test-cover.png;
          elif identify /tmp/NODIMS.bin >/dev/null 2>&1; then cp /tmp/NODIMS.bin portfolio-v2/assets/maximalist/test-cover.png;
          elif identify /tmp/EXACT.bin >/dev/null 2>&1; then cp /tmp/EXACT.bin portfolio-v2/assets/maximalist/test-cover.png; fi
      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portfolio-v2/assets/maximalist
          git diff --cached --quiet || git commit -m "Test Canva asset URL import"
          git push
