name: Import Maximalist slide renders
on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-maximalist.yml']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Canva slide renders
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p portfolio-v2/assets/maximalist
          python3 - <<'PY'
          import json, urllib.request, pathlib, struct
