      - name: Patch portfolio layout and About section
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re, html

          path = Path("portfolio-v2/index.html")
          text = path.read_text(encoding="utf-8")
          groups = json.loads('''{"04":{"name":"FORM / 26","dir":"form26-live","count":6},"05":{"name":"North & Form","dir":"north-form","count":14},"06":{"name":"MOLDA","dir":"molda-live","count":14},"07":{"name":"ODDLY / SOCIAL 02","dir":"oddly-social","count":5},"08":{"name":"MODULAR / 01","dir":"modular-01","count":6},"09":{"name":"Premium Square Planner","dir":"premium-square-planner","count":6}}''')

          # About: huge JANA name + medium intro, keep the rest unchanged.
          old = '<p class="bigcopy">I\'m Jana, a Graphic & Visual Designer with a strong interest in editorial design, presentation systems, visual layouts and creative communication.</p>'
          new = '<div class="about-name">JANA</div><p class="about-intro">I\'m Jana, a Graphic & Visual Designer with a strong interest in editorial design, presentation systems, visual layouts and creative communication.</p>'
          if old in text:
              text = text.replace(old, new, 1)

          # Add styling once.
          marker = '</style>\n</head>'
          css = '''
          <style id="about-jana-sizing">
          .about-name{font-family:Georgia,"Times New Roman",serif;font-size:clamp(82px,11vw,180px);line-height:.76;letter-spacing:-.07em;margin:0 0 28px;color:var(--ink)}
          .about-intro{font-size:clamp(22px,2.35vw,34px);line-height:1.32;letter-spacing:-.025em;margin:0;max-width:900px;color:#27222d}
          @media(max-width:650px){.about-name{font-size:clamp(76px,24vw,125px);margin-bottom:22px}.about-intro{font-size:22px}}
          </style>
          '''
          if 'id="about-jana-sizing"' not in text:
              text = text.replace(marker, css + marker, 1)

          # Put every supplied sample into its correct project visual.
          for num, info in groups.items():
              imgs = []
              for i in range(1, info["count"] + 1):
                  src = f'assets/{info["dir"]}/{i:02d}.png'
                  alt = html.escape(f'{info["name"]} — sample {i}', quote=True)
                  imgs.append(f'<img src="{src}" alt="{alt}" loading="{"eager" if i==1 else "lazy"}" decoding="async">')
              visual = '<div class="visual">' + ''.join(imgs) + '</div>'

              article_re = re.compile(
                  rf'(<article class="project[^>]*>.*?<div class="pmeta"><span>PROJECT\s*/\s*{num}\b.*?</article>)',
                  re.S
              )
              m = article_re.search(text)
              if not m:
                  raise RuntimeError(f"Project {num} article not found")
              article = m.group(1)
              article2, n = re.subn(r'<div class="visual"></div>', visual, article, count=1)
              if n != 1:
                  # If rerun, replace the first plain visual block up to the pbody/article close.
                  article2, n = re.subn(r'<div class="visual">.*?</div>(?=</div></article>)', visual, article, count=1, flags=re.S)
              if n != 1:
                  raise RuntimeError(f"Project {num} visual placeholder not found")
              text = text[:m.start()] + article2 + text[m.end():]

          # Enable the exact same clickable stacked interaction for projects 04–09 (and keep 10).
          text = text.replace(
              "const targets=new Set(['01','04','07','08','09','10']);",
              "const targets=new Set(['04','05','06','07','08','09','10']);"
          )

          path.write_text(text, encoding="utf-8")
          PY
      - name: Commit portfolio updates
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portfolio-v2/index.html portfolio-v2/assets/
          git commit -m "Add complete portfolio sample image stacks"
          git push
